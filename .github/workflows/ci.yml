name: CI

on:
  push:
    branches: [ main, devel ]
  pull_request:
    branches: [ main, devel ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install ruff
      run: pip install ruff
    - name: Run ruff
      run: ruff check .

  build-and-test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install C++ dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgsl-dev \
          libpng-dev \
          libcairo2-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          pkg-config \
          autoconf \
          automake \
          libtool \
          zlib1g-dev \
          libsuitesparse-dev \
          libgl1-mesa-dev \
          xvfb

    - name: Build C++ library
      run: |
        ./reconf
        ./configure
        make -j$(nproc)

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies and ibsimu
      run: |
        python -m pip install --upgrade pip
        LDFLAGS="-L$(pwd)/src/.libs" pip install .

    - name: Run tests with pytest
      run: |
        export LD_LIBRARY_PATH=$(pwd)/src/.libs
        xvfb-run pytest tests/

