name: Build and Test IBSimu

on:
  push:
    branches: [ devel, main ]
  pull_request:
    branches: [ devel, main ]

env:
  GSL_VERSION: gsl-2.8

jobs:
  build-linux:
    name: Build and Test on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libcairo2-dev \
            libpng-dev \
            zlib1g-dev \
            libgsl-dev \
            libgtk-3-dev \
            libgtkglext1-dev \
            libsuitesparse-dev \
            autoconf \
            automake \
            libtool \
            make \
            g++

      - name: Download and build GSL
        run: |
          curl https://mirror.ibcp.fr/pub/gnu/gsl/${{ env.GSL_DIR }}.tar.gz  --output ${{ env.GSL_DIR }}.tar.gz
          tar xvfz ${{ env.GSL_DIR }}.tar.gz

      - name: Configure GSL build
        working-directory: ${{ env.GSL_DIR }}
        run: |
          ./configure --prefix=$HOME/.local

      - name: Build
        working-directory: ${{ env.GSL_DIR }}
        run: |
          make -j$(nproc)

      - name: Run checks
        working-directory: ${{ env.GSL_DIR }}
        run: |
          make check

      - name: Install
        working-directory: ${{ env.GSL_DIR }}
        run: |
          make install

      - name: Install IBSimu
        working-directory: ${{ env.GSL_DIR }}
        run: |
          ./configure --prefix=$HOME/.local
