[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "ibsimu"
version = "1.0.6"
authors = [
    { name = "Taneli Kalvas", email = "taneli.kalvas@jyu.fi" },
]
description = "Python wrapper for IBSimu"
readme = "PYTHON.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
examples = ["matplotlib", "pyvista", "scipy"]
dev = ["pytest", "ruff", "numpy", "matplotlib"]

[tool.setuptools]
py-modules = []
